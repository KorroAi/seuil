<text class="muted" x="56" y="204.0" text-anchor="end">20 %</text>
<line class="grid" x1="64" x2="600" y1="135.0" y2="135.0" stroke-width="1"/>
<text class="muted" x="56" y="139.0" text-anchor="end">30 %</text>
<line class="grid" x1="64" x2="600" y1="70.0" y2="70.0" stroke-width="1"/>
