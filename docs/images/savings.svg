<text class="muted" x="600.0" y="350" text-anchor="middle">400 k</text>
<line class="axis" x1="64" x2="600" y1="330" y2="330" stroke-width="1"/>
<text class="muted" x="332" y="372" text-anchor="middle">compaction threshold (tokens in the conversation)</text>
